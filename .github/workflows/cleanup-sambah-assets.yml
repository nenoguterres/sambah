name: Cleanup SamBah Duplicate Assets

on:
  push:
    branches:
      - chore/limpeza-arquivos-sambah
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/limpeza-arquivos-sambah
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove rejected and exact duplicate assets
        shell: bash
        run: |
          rm -rf public/assets/rejeitados
          rm -f public/assets/brand/oficial/capbah-oficial.png
          rm -f public/assets/brand/oficial/logo-sambah-oficial.png
          rm -f public/assets/brand/actions/card-foodtruck.png
          rm -f public/assets/brand/actions/card-atendimento-crop.png
          rmdir public/assets/brand/oficial 2>/dev/null || true

          if ! grep -qxF '/public/assets/rejeitados/' .gitignore; then
            printf '\n/public/assets/rejeitados/\n' >> .gitignore
          fi

          cat > tests/brand-assets-cleanup.test.js <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { access } from "node:fs/promises";

          async function exists(path) {
            try {
              await access(path);
              return true;
            } catch {
              return false;
            }
          }

          test("mantem assets oficiais e remove rejeitados e copias exatas", async () => {
            assert.equal(await exists("public/assets/brand/logo-sambah-oficial.png"), true);
            assert.equal(await exists("public/assets/brand/capbah-oficial.png"), true);
            assert.equal(await exists("public/assets/rejeitados"), false);
            assert.equal(await exists("public/assets/brand/oficial/logo-sambah-oficial.png"), false);
            assert.equal(await exists("public/assets/brand/oficial/capbah-oficial.png"), false);
            assert.equal(await exists("public/assets/brand/actions/card-foodtruck.png"), false);
            assert.equal(await exists("public/assets/brand/actions/card-atendimento-crop.png"), false);
          });
          TEST

          rm -f .github/workflows/cleanup-sambah-assets.yml
          rm -f .github/workflows/repository-audit.yml

      - name: Run complete test suite
        run: npm test

      - name: Commit validated asset cleanup
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover assets rejeitados e duplicados"
          git push origin HEAD:chore/limpeza-arquivos-sambah
