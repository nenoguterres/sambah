name: Apply WhatsApp stability fix

on:
  push:
    branches:
      - fix/diagnose-whatsapp-duplicate-api
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[stability-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnose-whatsapp-duplicate-api
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic source and regression patch
        run: |
          node scripts/apply-whatsapp-stability-fix.mjs
          node scripts/adjust-dedupe-stable-order.mjs
          node scripts/adjust-whatsapp-v2-global-return-test.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check src/whatsapp/conversationMessageDedupe.js
          node --check src/whatsappConversationService.js
          node --check src/whatsapp/v2/portalInsanoEngine.js

      - name: Test legacy outbound deduplication
        run: node --test tests/whatsapp-legacy-outbound-dedupe.test.js

      - name: Test reset-loop protection
        run: node --test tests/whatsapp-v2-reset-loop.test.js

      - name: Test Central audio order
        run: node --test tests/audit.test.js

      - name: Test CRM in Meta mode
        run: node --test tests/crm.test.js

      - name: Test complete V2 routing
        shell: bash
        run: |
          set -o pipefail
          node --test tests/whatsapp-v2-lab.test.js 2>&1 | tee v2-test.log

      - name: Upload V2 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-test-failure
          path: v2-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Test Meta webhook integration
        run: node --test tests/whatsapp-webhook-meta.test.js

      - name: Run complete test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Upload complete-suite failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-failure
          path: full-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary patch machinery
        run: rm -f scripts/apply-whatsapp-stability-fix.mjs scripts/adjust-dedupe-stable-order.mjs scripts/adjust-whatsapp-v2-global-return-test.mjs .github/workflows/apply-whatsapp-stability-fix.yml v2-test.log full-test.log

      - name: Commit validated fix to isolated branch
        run: |
          git config user.name "SamBah Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[stability-applied] fix: stop WhatsApp duplicates and reset loops"
          git push origin HEAD:fix/diagnose-whatsapp-duplicate-api
