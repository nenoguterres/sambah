name: Cleanup SamBah Workhub Data

on:
  push:
    branches:
      - chore/limpeza-arquivos-sambah

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/limpeza-arquivos-sambah
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Workhub cleanup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, rm } from 'node:fs/promises';

          const servicePath = 'src/insanoWorkhubService.js';
          const serverPath = 'src/server.js';
          const ignorePath = '.gitignore';

          let service = await readFile(servicePath, 'utf8');
          const oldDefault = 'const defaultDataFile = fileURLToPath(new URL("./data/insano-workhub.json", import.meta.url));';
          const newDefault = 'const defaultDataFile = fileURLToPath(new URL("../data/insano-workhub.json", import.meta.url));';
          if (!service.includes(oldDefault) && !service.includes(newDefault)) {
            throw new Error('Nao foi possivel localizar defaultDataFile do Workhub');
          }
          service = service.replace(oldDefault, newDefault);
          await writeFile(servicePath, service, 'utf8');

          let server = await readFile(serverPath, 'utf8');
          const oldService = 'const insanoWorkhub = new InsanoWorkhubService();';
          const newService = 'const insanoWorkhub = new InsanoWorkhubService({ dataFile: dataFile("insano-workhub.json") });';
          if (!server.includes(oldService) && !server.includes(newService)) {
            throw new Error('Nao foi possivel localizar a criacao do InsanoWorkhubService');
          }
          server = server.replace(oldService, newService);
          await writeFile(serverPath, server, 'utf8');

          await rm('src/data/insano-workhub.json', { force: true });

          let ignore = await readFile(ignorePath, 'utf8');
          const rule = '/src/data/insano-workhub.json';
          if (!ignore.split(/\r?\n/).includes(rule)) {
            ignore = `${ignore.trim()}\n${rule}\n`;
            await writeFile(ignorePath, ignore, 'utf8');
          }

          await writeFile('tests/insano-workhub-runtime-storage.test.js', `import test from "node:test";\nimport assert from "node:assert/strict";\nimport { mkdtemp, readFile, rm } from "node:fs/promises";\nimport { tmpdir } from "node:os";\nimport { join } from "node:path";\nimport { InsanoWorkhubService } from "../src/insanoWorkhubService.js";\n\ntest("Workhub grava tarefas no DATA_DIR informado", async (t) => {\n  const dataDir = await mkdtemp(join(tmpdir(), "sambah-workhub-runtime-"));\n  t.after(() => rm(dataDir, { recursive: true, force: true }));\n  const dataFile = join(dataDir, "insano-workhub.json");\n  const service = new InsanoWorkhubService({ dataFile, idGenerator: () => "teste", now: () => new Date("2026-07-22T00:00:00.000Z") });\n  await service.createTask({ sourceModule: "sambah", targetModule: "workhub", title: "Teste de armazenamento" });\n  const tasks = JSON.parse(await readFile(dataFile, "utf8"));\n  assert.equal(tasks.length, 1);\n  assert.equal(tasks[0].id, "work_teste");\n  assert.equal(tasks[0].title, "Teste de armazenamento");\n});\n`, 'utf8');

          await rm('.github/workflows/cleanup-sambah-workhub-data.yml', { force: true });
          NODE

      - name: Check syntax
        run: |
          node --check src/insanoWorkhubService.js
          node --check src/server.js

      - name: Run complete test suite
        run: npm test

      - name: Commit validated Workhub cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: mover dados do Workhub para o runtime"
          git push origin HEAD:chore/limpeza-arquivos-sambah
