plugins {
    id "com.android.application"
}

android {
    namespace "br.com.insano.sambah"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.insano.sambah"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
