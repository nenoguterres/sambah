<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SamBah Central</title>
    <link rel="manifest" href="/sambah-conversas.webmanifest">
    <link rel="stylesheet" href="/conversas.css">
    <link rel="stylesheet" href="/admin/assets/sambah-shell.css">
  </head>
  <body>
    <main class="app" aria-label="SamBah Central">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div>
            <p>SamBah Central</p>
            <h1>Conversas</h1>
          </div>
          <button class="icon-button" id="refreshButton" type="button" title="Atualizar">↻</button>
        </header>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Pesquisar conversa">
        </div>
        <section class="connection-status" id="connectionStatus" aria-live="polite"></section>
        <section class="human-alert-panel" id="humanAlertPanel" aria-live="assertive"></section>
        <section class="push-panel" id="pushPanel"></section>
        <nav class="filters" aria-label="Filtros">
          <button class="active" type="button" data-filter="all">Tudo <span data-count="all">0</span></button>
          <button type="button" data-filter="unread">Não lidas <span data-count="unread">0</span></button>
          <button type="button" data-filter="human">Humano <span data-count="human">0</span></button>
          <button type="button" data-filter="inProgress">Em atendimento <span data-count="inProgress">0</span></button>
          <button type="button" data-filter="resolved">Resolvidas <span data-count="resolved">0</span></button>
        </nav>
        <section class="conversation-list" id="conversationList" aria-label="Conversas"></section>
      </aside>
      <section class="chat" id="chatPane" aria-live="polite">
        <div class="empty-state">
          <strong>Selecione uma conversa</strong>
          <span>Atendimentos do WhatsApp aparecem aqui.</span>
        </div>
      </section>
    </main>
    <script src="/conversas.js"></script>
    <script src="/admin/assets/sambah-shell.js"></script>
    <script src="/conversas-shell.js"></script>
  </body>
</html>
