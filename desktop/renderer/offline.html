<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SamBah sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b141a; color: #e9edef; }
      main { width: min(92vw, 560px); padding: 32px; border: 1px solid #2a3942; border-radius: 20px; background: #111b21; text-align: center; box-shadow: 0 20px 50px #0008; }
      .mark { width: 88px; height: 88px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(145deg, #00a884, #006b55); color: white; font-size: 42px; font-weight: 900; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #aebac1; line-height: 1.5; }
      button { border: 0; border-radius: 999px; padding: 13px 24px; background: #00a884; color: #071d18; font-size: 16px; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #667781; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SB</div>
      <h1>SamBah aguardando conexão</h1>
      <p>A internet ou o servidor está temporariamente indisponível. O aplicativo continuará tentando reconectar automaticamente.</p>
      <button id="retry" type="button">Tentar agora</button>
      <small>O aplicativo permanece ativo no computador.</small>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
