name: Apply WhatsApp stability fix

on:
  push:
    branches:
      - fix/diagnose-whatsapp-duplicate-api
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[stability-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnose-whatsapp-duplicate-api
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic source and regression patch
        run: node scripts/apply-whatsapp-stability-fix.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check src/whatsapp/conversationMessageDedupe.js
          node --check src/whatsappConversationService.js
          node --check src/whatsapp/v2/portalInsanoEngine.js

      - name: Test legacy outbound deduplication
        run: node --test tests/whatsapp-legacy-outbound-dedupe.test.js

      - name: Test reset-loop protection
        run: node --test tests/whatsapp-v2-reset-loop.test.js

      - name: Test complete V2 routing
        run: node --test tests/whatsapp-v2-lab.test.js

      - name: Test Meta webhook integration
        run: node --test tests/whatsapp-webhook-meta.test.js

      - name: Run complete test suite
        run: npm test

      - name: Remove temporary patch machinery
        run: rm -f scripts/apply-whatsapp-stability-fix.mjs .github/workflows/apply-whatsapp-stability-fix.yml

      - name: Commit validated fix to isolated branch
        run: |
          git config user.name "SamBah Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[stability-applied] fix: stop WhatsApp duplicates and reset loops"
          git push origin HEAD:fix/diagnose-whatsapp-duplicate-api
