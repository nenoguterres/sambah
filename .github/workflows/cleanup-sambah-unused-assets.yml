name: Cleanup SamBah Unused Assets

on:
  push:
    branches:
      - chore/limpeza-arquivos-sambah
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/limpeza-arquivos-sambah
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove unreferenced legacy assets
        shell: bash
        run: |
          rm -f public/assets/brand/actions/02-pedidos-insano.png
          rm -f public/assets/brand/actions/03-pedidos-buteco-xeriffe.png
          rm -f public/assets/brand/actions/04-falar-watts-atendimento.png
          rm -f public/assets/brand/actions/card-atendimento.png
          rm -f public/assets/brand/actions/card-pedidos-insano.png
          rm -f public/assets/brand/actions/card-xeriffe.png
          rm -f public/assets/brand/sambah-pay-logo-before-clipboard.png
          rm -f public/assets/brand/sambah-pay-logo-original.png

          cat > tests/active-action-assets.test.js <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { access } from "node:fs/promises";

          async function exists(path) {
            try {
              await access(path);
              return true;
            } catch {
              return false;
            }
          }

          test("mantem somente os cards de acao usados pela tela publica", async () => {
            const active = [
              "public/assets/brand/actions/01-agendar-foodtruck-beertruck-insano.png",
              "public/assets/brand/actions/02-pedidos-insano-crop.png",
              "public/assets/brand/actions/03-pedidos-buteco-xeriffe-crop.png",
              "public/assets/brand/actions/04-falar-watts-atendimento-crop.png"
            ];
            const removed = [
              "public/assets/brand/actions/02-pedidos-insano.png",
              "public/assets/brand/actions/03-pedidos-buteco-xeriffe.png",
              "public/assets/brand/actions/04-falar-watts-atendimento.png",
              "public/assets/brand/actions/card-atendimento.png",
              "public/assets/brand/actions/card-pedidos-insano.png",
              "public/assets/brand/actions/card-xeriffe.png",
              "public/assets/brand/sambah-pay-logo-before-clipboard.png",
              "public/assets/brand/sambah-pay-logo-original.png"
            ];
            for (const path of active) assert.equal(await exists(path), true, path);
            for (const path of removed) assert.equal(await exists(path), false, path);
          });
          TEST

          rm -f .github/workflows/cleanup-sambah-unused-assets.yml
          rm -f .github/workflows/reference-audit.yml

      - name: Run complete test suite
        run: npm test

      - name: Commit validated unused asset cleanup
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover assets legados sem referencia"
          git push origin HEAD:chore/limpeza-arquivos-sambah
