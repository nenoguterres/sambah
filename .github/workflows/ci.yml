name: SamBah CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check critical syntax
        run: |
          node --check src/server.js
          node --check src/perolaService.js
          node --check src/insanoWorkhubService.js

      - name: Run focused human recovery tests
        run: node --test tests/whatsapp-v2-human-operational-recovery.test.js

      - name: Capture V2 lab regression report
        id: v2lab
        shell: bash
        run: |
          set +e
          node --test tests/whatsapp-v2-lab.test.js > v2-lab-report.txt 2>&1
          code=$?
          cat v2-lab-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload V2 lab report
        uses: actions/upload-artifact@v4
        with:
          name: v2-lab-report
          path: v2-lab-report.txt

      - name: Fail when V2 lab failed
        if: steps.v2lab.outputs.exit_code != '0'
        run: exit 1
