name: Android SamBah Atendimento

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sambah-android-atendimento
    paths:
      - "android/sambah-atendimento/**"
      - ".github/workflows/android-sambah-atendimento.yml"
  pull_request:
    paths:
      - "android/sambah-atendimento/**"
      - ".github/workflows/android-sambah-atendimento.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        working-directory: android/sambah-atendimento
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: sambah-android-atendimento-debug
          path: android/sambah-atendimento/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
