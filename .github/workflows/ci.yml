name: SamBah CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_PROVIDER: meta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check critical syntax
        run: |
          node --check src/server.js
          node --check src/perolaService.js
          node --check src/insanoWorkhubService.js

      - name: Capture complete regression report
        id: complete
        shell: bash
        run: |
          set +e
          npm test > complete-test-report.txt 2>&1
          code=$?
          cat complete-test-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete report
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-report
          path: complete-test-report.txt

      - name: Fail when complete suite failed
        if: steps.complete.outputs.exit_code != '0'
        run: exit 1
